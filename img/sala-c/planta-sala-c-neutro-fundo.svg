<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="Rubik, Helvetica, Arial, sans-serif">
  <!-- Desenho SIMPLIFICADO da Sala C, baseado na planta WSDG do térreo (folhas A1.11 e A1.12). Medidas aproximadas. -->
  <rect width="680" height="440" fill="#0b0a09"/>

  <!-- Jardim (lado direito) -->
  <rect x="490" y="18" width="70" height="392" fill="#1a2118"/>
  <text x="525" y="214" fill="#6d8a68" font-size="12" text-anchor="middle" transform="rotate(90 525 214)" letter-spacing="3">JARDIM</text>

  <!-- Técnica C -->
  <path d="M256 18 L338 20 L468 57 L468 195 L340 225 L256 225 Z" fill="#1d1a17" stroke="#e9e6e1" stroke-width="3" stroke-linejoin="round"/>
  <text x="355" y="118" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">TÉCNICA C</text>
  <text x="355" y="140" fill="#d9d4cd" font-size="15" font-weight="500" text-anchor="middle">≈ 13 m²</text>

  <!-- Sound lock -->
  <rect x="196" y="240" width="56" height="44" fill="#1d1a17" stroke="#4a443e" stroke-width="2"/>
  <text x="224" y="259" fill="#a39d95" font-size="9" text-anchor="middle">Sound</text>
  <text x="224" y="271" fill="#a39d95" font-size="9" text-anchor="middle">lock</text>

  <!-- Sala de gravação C -->
  <path d="M276 248 L473 250 L468 408 L200 410 L220 360 L228 326 L268 322 L271 280 Z" fill="#24201c" stroke="#e9e6e1" stroke-width="3" stroke-linejoin="round"/>
  <text x="360" y="342" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">SALA DE GRAVAÇÃO</text>
  <text x="360" y="364" fill="#d9d4cd" font-size="15" font-weight="500" text-anchor="middle">≈ 12 m²</text>

  <!-- Visor acústico entre técnica e sala de gravação -->
  <line x1="362" y1="220" x2="422" y2="206" stroke="#d9d4cd" stroke-width="6" stroke-linecap="round"/>
  <line x1="362" y1="249" x2="422" y2="249" stroke="#d9d4cd" stroke-width="6" stroke-linecap="round"/>
  <line x1="392" y1="214" x2="392" y2="244" stroke="#d9d4cd" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Janelas para o jardim (luz natural) -->
  <line x1="468" y1="80" x2="468" y2="168" stroke="#7fc97a" stroke-width="6" stroke-linecap="round"/>
  <line x1="471" y1="300" x2="470" y2="372" stroke="#7fc97a" stroke-width="6" stroke-linecap="round"/>

  <!-- Portas acústicas (aberturas) -->
  <line x1="256" y1="188" x2="256" y2="216" stroke="#151311" stroke-width="7"/>
  <line x1="271" y1="258" x2="270" y2="280" stroke="#24201c" stroke-width="7"/>
  <path d="M256 188 A28 28 0 0 0 230 214" fill="none" stroke="#6f6962" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Legenda -->
  <line x1="40" y1="356" x2="60" y2="356" stroke="#d9d4cd" stroke-width="6" stroke-linecap="round"/>
  <text x="68" y="360" fill="#a39d95" font-size="11">visor acústico</text>
  <line x1="40" y1="378" x2="60" y2="378" stroke="#7fc97a" stroke-width="6" stroke-linecap="round"/>
  <text x="68" y="382" fill="#a39d95" font-size="11">janela (luz natural)</text>
  <line x1="40" y1="400" x2="60" y2="400" stroke="#6f6962" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="68" y="404" fill="#a39d95" font-size="11">porta acústica</text>

  <!-- Cota da sala de gravação -->
  <line x1="200" y1="420" x2="468" y2="420" stroke="#6f6962" stroke-width="1"/>
  <line x1="200" y1="415" x2="200" y2="425" stroke="#6f6962"/><line x1="468" y1="415" x2="468" y2="425" stroke="#6f6962"/>
  <text x="334" y="435" fill="#a39d95" font-size="11" text-anchor="middle">≈ 4,7 m</text>
</svg>
